<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nessy-orch — Вариант C — Входящие</title>
<link rel="stylesheet" href="./tokens.css">
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 var(--fs-md)/var(--lh) var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
.app { display: grid; grid-template-columns: 208px 436px minmax(0, 1fr); height: 100vh; }

/* ---------- иконки и общие ---------- */
.ic { width: 16px; height: 16px; flex: none; display: block; }
.spin { animation: spin 1.1s linear infinite; }
.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.88); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 var(--warn-soft); } 100% { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .spin, .pulse, .banner.attention { animation: none !important; } }
.c-wait { color: var(--warn); } .c-err { color: var(--danger); } .c-work { color: var(--accent-text); }
.c-done { color: var(--success); } .c-idle { color: var(--text-faint); } .c-start { color: var(--st-starting); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 7px; border: 1px solid var(--border); border-radius: var(--r-full); font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; background: var(--bg-alt); }
.chip i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.chip.mono { font-family: var(--font-mono); font-size: 10.5px; }
kbd { font: 500 10.5px var(--font-mono); padding: 0 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--text-muted); background: var(--bg-alt); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg-alt); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; transition: background var(--dur) var(--ease); }
.btn:hover { background: var(--bg-active); }
.btn:focus-visible, .row:focus-visible, .nav-item:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: -1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ok { background: var(--success); border-color: var(--success); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 22px; padding: 0 8px; font-size: var(--fs-xs); }
.btn.lg { height: 32px; padding: 0 14px; font-size: var(--fs-md); }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-sm); color: var(--text-muted); }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.bar { height: 4px; border-radius: 2px; background: var(--bg-active); overflow: hidden; }
.bar > b { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s var(--ease); }
.bar.done > b { background: var(--success); }
.muted { color: var(--text-muted); } .faint { color: var(--text-faint); }
.tick { font-variant-numeric: tabular-nums; }

/* ---------- левая навигация ---------- */
.nav { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; min-height: 0; }
.brand { padding: 2px 8px 10px; }
.brand b { font-size: var(--fs-lg); letter-spacing: -.01em; }
.variant { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--accent-text); }
.compose { margin: 0 0 10px; width: 100%; justify-content: center; height: 32px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border: 0; background: transparent; border-radius: var(--r-sm); color: var(--text-muted); text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-active); color: var(--text); font-weight: 600; }
.nav-item .ic { width: 15px; height: 15px; }
.nav-item .n { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.nav-item.active .n { color: var(--text-muted); }
.nav-item .n.hot { background: var(--accent); color: #fff; border-radius: var(--r-full); padding: 0 6px; font-weight: 600; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 6px; }
.nav-sp { flex: 1; }
.nav-foot { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
.nav-foot .muted { font-size: var(--fs-xs); flex: 1; padding-left: 6px; }

/* ---------- список ---------- */
.list-col { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
.list-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
.list-head h2 { margin: 0 0 8px; font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.list-head h2 span { font-size: var(--fs-sm); color: var(--text-faint); font-weight: 400; }
.counters { display: flex; gap: 6px; flex-wrap: wrap; }
.cnt { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--r-full); background: transparent; font-size: var(--fs-sm); color: var(--text-muted); }
.cnt:hover { background: var(--bg-hover); }
.cnt .ic { width: 12px; height: 12px; }
.cnt.on { background: var(--bg-active); color: var(--text); border-color: var(--border-strong); }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.sec { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 7px 14px 4px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 600; display: flex; gap: 6px; border-bottom: 1px solid transparent; }
.sec.c-wait, .sec.c-err { }
.row { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 3px; padding: 9px 14px 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; outline: none; }
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .st { padding-top: 2px; }
.row .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; grid-column: 2; }
.row .title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--text); }
.row.unread .title { font-weight: 650; }
.row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-left: -2px; }
.row .rt { grid-column: 3; grid-row: 1; font-size: var(--fs-xs); color: var(--text-muted); text-align: right; }
.row .rt2 { grid-column: 3; grid-row: 2; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-faint); justify-content: flex-end; }
.row .rt2 .bar { width: 44px; }
.row .l2 { grid-column: 2; display: block; font-size: var(--fs-sm); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unread .l2 { color: var(--text); }
.row .l2.c-wait { color: var(--warn); } .row .l2.c-err { color: var(--danger); }
.row .l2 .ic { display: inline-block; vertical-align: -3px; width: 13px; height: 13px; margin-right: 3px; }
.acts { position: absolute; right: 10px; bottom: 6px; display: none; gap: 4px; padding-left: 24px; background: linear-gradient(90deg, transparent, var(--bg-hover) 18px); }
.row.sel .acts { background: linear-gradient(90deg, transparent, var(--accent-soft) 18px); }
.row:hover .acts, .row:focus-within .acts { display: flex; }
.row:hover .acts, .row.sel:hover .acts { background: linear-gradient(90deg, transparent, var(--bg) 18px); }
.list-foot { border-top: 1px solid var(--border); padding: 7px 14px; display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-faint); background: var(--bg-alt); }
.list-foot span { display: inline-flex; align-items: center; gap: 4px; }
.empty { padding: 48px 20px; text-align: center; color: var(--text-faint); }
.empty b { display: block; color: var(--text-muted); font-size: var(--fs-lg); margin-bottom: 4px; }
.logrow { padding: 8px 14px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: var(--fs-sm); }
.logrow time { color: var(--text-faint); font-variant-numeric: tabular-nums; }
.logrow b { font-weight: 600; }
.ref-row { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.ref-row small { color: var(--text-faint); margin-left: auto; font-size: var(--fs-xs); }

/* ---------- читалка ---------- */
.read-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.toolbar { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.toolbar .crumb { color: var(--text-muted); font-size: var(--fs-sm); margin: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.toolbar .back { display: none; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.doc { max-width: 780px; margin: 0 auto; padding: 22px 32px 28px; }
.doc h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; letter-spacing: -.015em; font-weight: 650; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: var(--r-full); font-size: var(--fs-sm); font-weight: 600; border: 1px solid currentColor; }
.pill .ic { width: 12px; height: 12px; }
.pill.c-wait { background: var(--warn-soft); } .pill.c-err { background: var(--danger-soft); }
.pill.c-work { background: var(--accent-soft); } .pill.c-done { background: color-mix(in srgb, var(--success) 14%, transparent); }
.banner { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid; margin-bottom: 18px; }
.banner > .ic { width: 22px; height: 22px; margin-top: 1px; }
.banner .bt { flex: 1; min-width: 0; }
.banner h3 { margin: 0 0 2px; font-size: var(--fs-lg); font-weight: 650; }
.banner p { margin: 0 0 8px; color: var(--text-muted); font-size: var(--fs-sm); }
.banner .cmd { display: block; background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 10px; margin: 8px 0 12px; font-family: var(--font-mono); font-size: 12px; overflow-x: auto; color: var(--text); }
.banner .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.banner.attention { border-color: var(--warn); background: var(--warn-soft); animation: ring 2s ease-out infinite; }
.banner.attention > .ic, .banner.attention h3 { color: var(--warn); }
.banner.error { border-color: var(--danger); background: var(--danger-soft); }
.banner.error > .ic, .banner.error h3 { color: var(--danger); }
.banner.result { border-color: color-mix(in srgb, var(--success) 55%, transparent); background: color-mix(in srgb, var(--success) 10%, transparent); }
.banner.result > .ic, .banner.result h3 { color: var(--success); }
.banner.info { border-color: var(--border-strong); background: var(--bg-alt); }
.blk { margin-bottom: 22px; }
.blk > h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
.blk > h4 em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--text-muted); font-weight: 500; font-size: var(--fs-sm); }
.blk > h4::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.now { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-card); }
.now > div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); min-height: 36px; }
.now > div:last-child { border-bottom: 0; }
.now .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.plan-head .bar { flex: 1; height: 6px; } .plan-head b { font-variant-numeric: tabular-nums; }
.check { list-style: none; margin: 0; padding: 0; }
.check li { display: flex; align-items: center; gap: 10px; padding: 5px 2px; }
.check li.done { color: var(--text-muted); } .check li.done span { text-decoration: line-through; text-decoration-color: var(--text-faint); }
.check li.active { font-weight: 600; }
.check .ic { width: 15px; height: 15px; }
.check .state { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); }
.md { line-height: 1.6; }
.md p { margin: 0 0 10px; }
.md code { background: var(--bg-code); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; }
.md table { border-collapse: collapse; margin: 6px 0 4px; width: 100%; font-size: var(--fs-md); border: 1px solid var(--border); border-radius: var(--r-sm); }
.md th, .md td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border); }
.md th { background: var(--bg-alt); font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; }
.md tr:last-child td { border-bottom: 0; }
.res-card { border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px 8px; background: var(--bg-card); }
.res-card .res-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--text-muted); font-size: var(--fs-sm); }
.res-card .res-top .btn { margin-left: auto; }
.res-card + .res-card { margin-top: 8px; }
.res-empty { color: var(--text-faint); border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: 12px 14px; font-size: var(--fs-sm); }
.agents { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.ag { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.ag:last-child { border-bottom: 0; }
.ag:hover { background: var(--bg-hover); }
.ag.focus { background: var(--accent-soft); }
.ag .nm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.ag .nm b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
.ag .nm .tree { color: var(--text-faint); font-family: var(--font-mono); }
.ag .sub { grid-column: 2; font-size: var(--fs-sm); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .rr { grid-column: 3; grid-row: 1 / 3; text-align: right; font-size: var(--fs-xs); color: var(--text-muted); }
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; position: relative; }
.tl::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 1px; background: var(--border-strong); }
.tl li { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; padding: 5px 0; align-items: start; }
.tl .ic { width: 15px; height: 15px; background: var(--bg); border-radius: 50%; margin-top: 2px; }
.tl .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .tt small { display: block; color: var(--text-faint); font-size: var(--fs-sm); white-space: normal; }
.tl .tt .err-box { margin-top: 4px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--danger-soft); color: var(--danger); font-family: var(--font-mono); font-size: 11.5px; white-space: normal; }
.tl .du { font-size: var(--fs-xs); color: var(--text-faint); padding-top: 3px; font-variant-numeric: tabular-nums; }
.more { color: var(--accent-text); font-size: var(--fs-sm); padding: 2px 0 0 30px; }
details.chat { border: 1px solid var(--border); border-radius: var(--r-md); }
details.chat > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; gap: 8px; align-items: center; color: var(--text-muted); }
details.chat > summary::-webkit-details-marker { display: none; }
details.chat > summary::before { content: '▸'; font-size: 10px; transition: transform var(--dur); }
details.chat[open] > summary::before { transform: rotate(90deg); }
details.chat .msgs { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
.msg { max-width: 88%; padding: 7px 11px; border-radius: var(--r-md); background: var(--bg-alt); border: 1px solid var(--border); font-size: var(--fs-md); }
.msg small { display: block; color: var(--text-faint); font-size: var(--fs-xs); margin-bottom: 1px; }
.msg.you { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent-ring); }
.composer { border-top: 1px solid var(--border); padding: 10px 16px 12px; background: var(--bg-alt); flex: none; }
.composer .in { max-width: 748px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-input); }
.composer .in:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
.composer textarea { display: block; width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; resize: none; padding: 9px 12px 2px; height: 42px; outline: none; }
.composer .bt { display: flex; align-items: center; gap: 10px; padding: 4px 8px 6px 12px; font-size: var(--fs-sm); color: var(--text-muted); }
.composer label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.composer input[type=checkbox] { accent-color: var(--accent); margin: 0; }
.composer .to { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); }
.placeholder { margin: auto; text-align: center; color: var(--text-faint); padding: 40px; }

/* ---------- диалог и тост ---------- */
.modal-bg { position: fixed; inset: 0; background: var(--overlay); display: none; place-items: center; z-index: 50; padding: 16px; }
.modal-bg.show { display: grid; }
.modal { width: min(480px, 100%); background: var(--bg-alt); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-3); padding: 18px; }
.modal h3 { margin: 0 0 12px; font-size: var(--fs-lg); }
.modal label { display: block; font-size: var(--fs-sm); color: var(--text-muted); margin: 10px 0 4px; }
.modal textarea, .modal select, .modal input { width: 100%; background: var(--bg-input); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 7px 9px; font: inherit; }
.modal textarea { height: 76px; resize: none; }
.modal .ft { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--bg-active); backdrop-filter: blur(8px); background-color: color-mix(in srgb, var(--bg-alt) 92%, var(--text)); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 8px 8px 8px 14px; box-shadow: var(--shadow-2); display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: all .2s var(--ease); z-index: 60; font-size: var(--fs-sm); max-width: calc(100vw - 24px); }
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast a { color: var(--accent-text); cursor: pointer; font-weight: 600; }

/* ---------- мобильная раскладка ---------- */
@media (max-width: 899px) {
	body { overflow: hidden; }
	.app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
	.nav { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 12px 6px; gap: 4px 6px; border-right: 0; border-bottom: 1px solid var(--border); }
	.brand { padding: 0; flex: 1 1 auto; }
	.brand b { font-size: var(--fs-md); } .variant { margin: 0; }
	.compose { width: auto; margin: 0; height: 30px; order: 2; padding: 0 10px; }
	.nav-foot { order: 3; } .nav-foot .muted { display: none; }
	.nav-sep, .nav-sp { display: none; }
	.nav-chips { order: 5; width: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
	.nav-item { width: auto; height: 26px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--r-full); gap: 5px; font-size: var(--fs-sm); }
	.nav-item .ic { display: none; }
	.nav-item .n { margin-left: 0; }
	.counters { display: none; }
	.list-head { padding: 8px 14px 6px; } .list-head h2 { margin: 0; }
	.list-col { border-right: 0; }
	.list-foot { display: none; }
	.acts { display: none !important; }
	.read-col { position: fixed; inset: 0; z-index: 30; transform: translateX(100%); transition: transform .22s var(--ease); }
	.app.reading .read-col { transform: none; }
	.toolbar .back { display: inline-grid; }
	.toolbar .pn { display: none; }
	.doc { padding: 16px 16px 20px; } .doc h1 { font-size: 19px; }
	.composer { padding: 8px 12px 10px; }
	.banner { flex-wrap: wrap; padding: 12px; } .banner > .ic { width: 20px; height: 20px; }
	.md table { font-size: var(--fs-sm); } .md th, .md td { padding: 5px 8px; }
	.kbd-only { display: none; }
}

function nowBlock(t) {

function stepsBlock(t) {

function chatBlock(t) {

function statusPill(t) {

function renderRead() {

function renderAll() { renderNav(); renderCounters(); renderList(); renderRead(); $('app').classList.toggle('reading', !!S.mobileOpen && !S.page) }

/* ---------- действия ---------- */
var toastT

function select(id, open) { S.sel = id; var t = byId(id); if (t && t.status === 'done' && !t.read && open) t.read = true; if (open) S.mobileOpen = true; S.page = null; renderAll(); var r = document.querySelector('.row.sel'); if (r) r.scrollIntoView({ block: 'nearest' }) }

	if (a === 'prev' || a === 'next') return move(a === 'next' ? 1 : -1)

function send() {

document.addEventListener('click', function (e) {

/* ---------- таймеры ---------- */
setInterval(function () {
