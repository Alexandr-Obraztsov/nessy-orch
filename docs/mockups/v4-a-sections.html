<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агенты · nessy</title>
<style>
/* =====================================================================
   Токены v4. 4px-сетка, типошкала, радиусы, тени, цвета, движение.
   ===================================================================== */
:root {
	--space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
	--space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 48px;

	--text-xs: 11.5px;  --lh-xs: 16px;
	--text-sm: 12.5px;  --lh-sm: 18px;
	--text-md: 14px;    --lh-md: 20px;
	--text-lg: 16px;    --lh-lg: 24px;
	--text-xl: 22px;    --lh-xl: 28px;
	--font-ui: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
	--font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

	--radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 999px;

	--dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 360ms;
	--ease-out: cubic-bezier(.2, .8, .2, 1);
	--ease-spring: cubic-bezier(.34, 1.56, .64, 1);

	--content-w: 980px;
	--chip-l: 72%; --chip-s: 70%;
}
:root, :root[data-theme="dark"] {
	color-scheme: dark;
	--gray-0: #0d0f12; --gray-1: #12151a; --gray-2: #171b21; --gray-3: #1d222a; --gray-4: #262c35;
	--gray-5: #313944; --gray-6: #3f4955; --gray-7: #566170; --gray-8: #707c8c; --gray-9: #8e99a8;
	--gray-10: #b2bbc7; --gray-11: #d5dbe3; --gray-12: #f0f3f6;
	--accent: #7b9bff; --accent-strong: #98b0ff; --on-accent: #0b1020;
	--st-work: #5aa9ff; --st-wait: #f2b23c; --st-error: #ff6b6b; --st-done: #4cc38a;
	--shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 0 0 1px rgb(255 255 255 / .02);
	--shadow-2: 0 16px 48px rgb(0 0 0 / .55), 0 2px 8px rgb(0 0 0 / .4);
	--scrim: rgb(5 7 10 / .55);
}
:root[data-theme="light"] {
	color-scheme: light;
	--gray-0: #f4f6f8; --gray-1: #ffffff; --gray-2: #fbfcfd; --gray-3: #f0f2f5; --gray-4: #e4e8ec;
	--gray-5: #d6dbe1; --gray-6: #c2c9d1; --gray-7: #a1abb7; --gray-8: #7f8996; --gray-9: #636d79;
	--gray-10: #48515c; --gray-11: #2b323a; --gray-12: #12161b;
	--accent: #3b5bdb; --accent-strong: #2f49b8; --on-accent: #ffffff;
	--st-work: #1971c2; --st-wait: #b36b00; --st-error: #d6303a; --st-done: #1c8c5a;
	--shadow-1: 0 1px 2px rgb(20 30 45 / .06), 0 0 0 1px rgb(20 30 45 / .02);
	--shadow-2: 0 16px 48px rgb(20 30 45 / .22), 0 2px 8px rgb(20 30 45 / .1);
	--scrim: rgb(20 28 40 / .35);
	--chip-l: 30%; --chip-s: 60%;
}
:root {
	--bg: var(--gray-0); --surface: var(--gray-2); --surface-2: var(--gray-3); --surface-3: var(--gray-4);
	--border: var(--gray-4); --border-strong: var(--gray-5);
	--text: var(--gray-12); --text-2: var(--gray-10); --text-3: var(--gray-9); --text-4: var(--gray-8);
	--st-work-bg: color-mix(in srgb, var(--st-work) 14%, transparent);
	--st-wait-bg: color-mix(in srgb, var(--st-wait) 14%, transparent);
	--st-error-bg: color-mix(in srgb, var(--st-error) 14%, transparent);
	--st-done-bg: color-mix(in srgb, var(--st-done) 14%, transparent);
}
:root[data-theme="light"] { --surface: var(--gray-1); --surface-2: var(--gray-2); --surface-3: var(--gray-3); }

/* ---------- база ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--text-md)/var(--lh-md) var(--font-ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
code { font-family: var(--font-mono); font-size: .92em; background: var(--surface-3); border-radius: 4px; padding: 1px 5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: var(--content-w); margin: 0 auto; padding: 0 var(--space-5); }

/* ---------- шапка ---------- */
.top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) 0 var(--space-4); flex-wrap: wrap; }
.brand { font-weight: 650; font-size: var(--text-lg); line-height: var(--lh-lg); letter-spacing: -.01em; }
.vtag { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 2px 10px; border-radius: var(--radius-full); white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-sm); color: var(--text-2); font-size: var(--text-sm); border: 1px solid var(--border); background: var(--surface); transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast); white-space: nowrap; }
.tbtn:hover { background: var(--surface-3); color: var(--text); }
.tbtn[aria-pressed="true"] { color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.tbtn svg { width: 14px; height: 14px; }

/* ---------- панель сводки ---------- */
.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: var(--space-3) 0; border-bottom: 1px solid transparent; transition: border-color var(--dur-base); }
.toolbar.stuck { border-bottom-color: var(--border); }
.toolbar .wrap { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.chip-f { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--text-sm); transition: all var(--dur-fast); white-space: nowrap; }
.chip-f:hover { background: var(--surface-3); color: var(--text); }
.chip-f i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gray-8)); flex: none; }
.chip-f b { font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; display: inline-block; }
.chip-f.zero { opacity: .55; }
.chip-f[aria-pressed="true"] { color: var(--text); border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface)); }
.chip-f.bump b { animation: bump var(--dur-slow) var(--ease-spring); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

/* ---------- секции ---------- */
main { padding-bottom: var(--space-8); }
.sec { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur-slow) var(--ease-out); }
.sec.off { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
.sec > .sec-in { min-height: 0; overflow: hidden; padding-top: var(--space-6); margin-top: calc(-1 * var(--space-1)); }
.sec-h { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); min-height: 28px; }
.sec-h h2 { margin: 0; font-size: var(--text-md); line-height: var(--lh-md); font-weight: 650; letter-spacing: 0; }
.sec-h .n { font-size: var(--text-sm); color: var(--text-3); background: var(--surface-3); border-radius: var(--radius-full); padding: 0 8px; font-variant-numeric: tabular-nums; }
.sec-h .hint { font-size: var(--text-sm); color: var(--text-3); }
.sec-h .tbtn { margin-left: auto; height: 28px; border-color: transparent; background: transparent; }
.sec[data-s="needs"] h2 { color: var(--st-wait); }
.empty { color: var(--text-3); font-size: var(--text-sm); padding: var(--space-5) var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); text-align: center; }
.peek { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--text-3); font-size: var(--text-sm); cursor: pointer; transition: all var(--dur-fast); width: 100%; text-align: left; }
.peek:hover { color: var(--text-2); border-color: var(--gray-7); }
.done-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur-slow); opacity: 0; }
.done-body.open { grid-template-rows: 1fr; opacity: 1; }
.done-body > div { min-height: 0; overflow: hidden; }
.peekwrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur-base); }
.peekwrap.off { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
.peekwrap > div { min-height: 0; overflow: hidden; }

/* ---------- строка ---------- */
.rowwrap { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur-slow) var(--ease-out); }
.rowwrap.off { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
.rowinner { min-height: 0; overflow: hidden; padding: 1px 1px 0; margin: -1px -1px 0; }
.row { position: relative; margin-bottom: var(--space-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-1); transition: border-color var(--dur-base), background var(--dur-base); }
.row:hover { border-color: var(--border-strong); }
.row[data-kind="wait"] { border-color: color-mix(in srgb, var(--st-wait) 40%, var(--border)); background: color-mix(in srgb, var(--st-wait) 4%, var(--surface)); }
.row[data-kind="error"] { border-color: color-mix(in srgb, var(--st-error) 38%, var(--border)); background: color-mix(in srgb, var(--st-error) 4%, var(--surface)); }
.row.flash::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: flash 1.5s var(--ease-out) forwards; }
.row.flash-ok::before { --fc: var(--st-done); }
.row.flash::before { --fc: var(--st-done); }
.row.flash-wait::before { --fc: var(--st-wait); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--fc) 55%, transparent), inset 0 0 0 999px color-mix(in srgb, var(--fc) 16%, transparent); } 60% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--fc) 0%, transparent), inset 0 0 0 999px color-mix(in srgb, var(--fc) 8%, transparent); } 100% { box-shadow: 0 0 0 0 transparent, inset 0 0 0 999px transparent; } }

.head { display: grid; grid-template-columns: 28px minmax(0, 1fr) 280px 100px; column-gap: var(--space-4); align-items: center; min-height: 64px; padding: var(--space-3) var(--space-4); cursor: pointer; border-radius: var(--radius-md); }
.head:focus-visible { outline-offset: -2px; }
.ico { width: 28px; height: 28px; display: grid; place-items: center; align-self: center; }
.ico svg { width: 22px; height: 22px; overflow: visible; }
.main { min-width: 0; }
.l1 { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.name { font-weight: 600; white-space: nowrap; }
.role { --h: 200; flex: none; font-size: var(--text-xs); line-height: var(--lh-xs); padding: 0 8px; border-radius: var(--radius-full); color: hsl(var(--h) var(--chip-s) var(--chip-l)); background: hsl(var(--h) 60% 50% / .14); align-self: center; white-space: nowrap; }
.task { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.new-tag { flex: none; align-self: center; font-size: 10.5px; line-height: 15px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--st-done); background: var(--st-done-bg); border-radius: var(--radius-full); padding: 0 7px; animation: pop var(--dur-slow) var(--ease-spring); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.l2 { font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.l2 .tool { font-family: var(--font-mono); font-size: 12px; }
.l2 .timer { font-variant-numeric: tabular-nums; color: var(--text-2); }
.plan { min-width: 0; }
.pl1 { display: flex; align-items: center; gap: var(--space-2); }
.bar { display: flex; gap: 3px; flex: 1 1 auto; min-width: 0; }
.seg { flex: 1 1 0; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.seg i { position: absolute; inset: 0; border-radius: inherit; background: var(--st-done); transform-origin: left center; transform: scaleX(0); transition: transform 700ms var(--ease-out), background var(--dur-slow); }
.seg.done i { transform: scaleX(1); }
.seg.active i { transform: scaleX(.5); background: var(--st-work); animation: segpulse 1.8s ease-in-out infinite; }
.seg.error i { transform: scaleX(1); background: var(--st-error); }
.seg.wait.active i { background: var(--st-wait); animation: none; }
@keyframes segpulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
.count { font-size: var(--text-sm); font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 26px; text-align: right; font-weight: 600; }
.step { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--st-work); flex: none; animation: dotpulse 1.6s ease-in-out infinite; }
.step .dot.none { display: none; }
.step span { overflow: hidden; text-overflow: ellipsis; }
@keyframes dotpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--st-work) 60%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; opacity: .6; } }
.tail { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.stop { height: 28px; padding: 0 10px; border-radius: var(--radius-sm); font-size: var(--text-sm); color: var(--text-2); border: 1px solid var(--border-strong); opacity: 0; transform: translateX(4px); transition: all var(--dur-fast); background: var(--surface); }
.row:hover .stop, .head:focus-within .stop, .stop:focus-visible { opacity: 1; transform: none; }
.stop:hover { color: var(--st-error); border-color: var(--st-error); background: var(--st-error-bg); }
.chev { width: 16px; height: 16px; color: var(--text-4); transition: transform var(--dur-base) var(--ease-out); flex: none; }
.row[aria-expanded="true"] .chev, .row.open .chev { transform: rotate(180deg); }

/* требует вас */
.attn { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); padding: 0 var(--space-4) var(--space-3) calc(var(--space-4) + 28px + var(--space-4)); margin-top: calc(-1 * var(--space-1)); }
.attn:empty { display: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 650; letter-spacing: .02em; color: var(--st-wait); background: var(--st-wait-bg); }
.badge.pulse { animation: badgepulse 2.2s ease-in-out infinite; }
.badge.err { color: var(--st-error); background: var(--st-error-bg); }
@keyframes badgepulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--st-wait) 45%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--st-wait) 0%, transparent); } }
.attn code { font-size: 12.5px; padding: 3px 8px; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attn .errtxt { color: var(--text-2); font-size: var(--text-sm); }
.btns { display: flex; gap: var(--space-2); margin-left: auto; }
.btn { height: 32px; padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); font-size: var(--text-sm); font-weight: 550; transition: all var(--dur-fast); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ok { background: var(--st-done); color: #fff; border-color: transparent; animation: okpop var(--dur-slow) var(--ease-spring); }
.btn.no { background: var(--surface-3); color: var(--text-3); }
.btn.danger { color: var(--st-error); }
.btn.danger:hover { background: var(--st-error-bg); border-color: var(--st-error); }
.btn svg { width: 14px; height: 14px; }
@keyframes okpop { 0% { transform: scale(.9); } 55% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* раскрытие на месте */
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-out); }
.row[aria-expanded="true"] .more { grid-template-rows: 1fr; }
.more > div { min-height: 0; overflow: hidden; }
.more-in { padding: var(--space-2) var(--space-4) var(--space-4) calc(var(--space-4) + 28px + var(--space-4)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5) var(--space-6); border-top: 1px solid var(--border); margin: 0 var(--space-4); padding-left: calc(28px + var(--space-4)); padding-right: 0; padding-top: var(--space-4); }
.more h4 { margin: 0 0 var(--space-2); font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.cl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cl li { display: flex; gap: 10px; align-items: flex-start; font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--text-2); }
.cl li.done { color: var(--text-3); }
.cl li.active { color: var(--text); font-weight: 550; }
.cl li.error { color: var(--st-error); }
.cl .bx { flex: none; width: 16px; height: 16px; margin-top: 1px; }
.cl .bx circle { fill: none; stroke: var(--gray-6); stroke-width: 1.5; }
.cl li.done .bx circle { fill: var(--st-done); stroke: var(--st-done); }
.cl li.active .bx circle { stroke: var(--st-work); animation: ringpulse 1.6s ease-in-out infinite; }
.cl li.error .bx circle { stroke: var(--st-error); }
@keyframes ringpulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
.ck { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 0; }
.fresh .ck, .ico .ck { animation: draw 520ms var(--ease-out) both; }
@keyframes draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
.msg { font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--text-2); background: var(--surface-2); border-left: 2px solid var(--border-strong); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: var(--space-2) var(--space-3); margin: 0; }
.more-act { grid-column: 1 / -1; display: flex; gap: var(--space-2); align-items: center; }
.more-act .meta { color: var(--text-3); font-size: var(--text-sm); margin-left: auto; font-variant-numeric: tabular-nums; }
.more-in .full { grid-column: 1 / -1; }

/* итоговый ответ */
.res .sum { margin: 0 0 var(--space-3); color: var(--text); font-size: var(--text-md); line-height: 22px; }
.res ul { margin: 0 0 var(--space-3); padding-left: 18px; color: var(--text-2); font-size: var(--text-sm); line-height: var(--lh-sm); display: grid; gap: 4px; }
.res ul li::marker { color: var(--text-4); }
.src-h { font-size: var(--text-xs); font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 var(--space-2); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: var(--radius-full); border: 1px solid var(--border-strong); background: var(--surface-2); font-size: var(--text-sm); color: var(--text-2); text-decoration: none; max-width: 100%; transition: all var(--dur-fast); }
.src:hover { color: var(--accent-strong); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
.src svg { width: 12px; height: 12px; flex: none; opacity: .7; }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src em { font-style: normal; color: var(--text-4); font-size: var(--text-xs); }

/* иконки статуса */
.spin { animation: spin 1.1s linear infinite; }
.spin .t { fill: none; stroke: var(--surface-3); stroke-width: 2.5; }
.spin .a { fill: none; stroke: var(--st-work); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 18 60; }
@keyframes spin { to { transform: rotate(360deg); } }

function stopAgent(a) {
	a.status = 'stopped'; a.finishing = false; a.doneAt = Date.now(); a.duration = (a.doneAt - a.startedAt) / 1000; a.permission = null; a.attention = null; a.isNew = true
	a.lastMsg = 'Остановлен вручную.'
	a.res = { summary: 'Работа остановлена пользователем на шаге «' + (a.plan[activeIdx(a)] ? a.plan[activeIdx(a)].text : '') + '».', points: [], sources: [] }
	if (rows[a.id]) { rows[a.id].row.classList.remove('flash'); void rows[a.id].row.offsetWidth; rows[a.id].row.classList.add('flash') }
	updateRow(a); place(a, true); refresh(); toast('Остановлен: ' + a.name); if (S.drawerId === a.id) renderDrawer()
}
function toggleRow(a) {
	S.openRows[a.id] = !S.openRows[a.id]
	if (S.openRows[a.id] && a.isNew) { a.isNew = false }
	updateRow(a)
}

document.addEventListener('click', function (e) {
	var f = e.target.closest('.chip-f')
	if (f) { S.filter = S.filter === f.dataset.f ? null : f.dataset.f; S.agents.forEach(applyRowVisibility); refresh(); store('v4a.filter', S.filter || ''); return }
	if (e.target.closest('#tCompact')) { S.compact = !S.compact; refresh(); store('v4a.compact', S.compact ? '1' : '0'); return }
	if (e.target.closest('#tHide')) { S.hideDone = !S.hideDone; refresh(); store('v4a.hide', S.hideDone ? '1' : '0'); return }
	if (e.target.closest('#doneToggle') || e.target.closest('#peek')) { S.doneOpen = !S.doneOpen; refresh(); store('v4a.doneOpen', S.doneOpen ? '1' : '0'); return }
	if (e.target.closest('#restart')) { restart(); return }
	if (e.target.closest('#theme')) { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); return }
	if (e.target.closest('#scrim') || e.target.closest('[data-act=close]')) { closeDrawer(); return }
	var act = e.target.closest('[data-act]')
	var wrap = e.target.closest('.rowwrap'), dr = e.target.closest('#drawer')
	var a = wrap ? S.byId[wrap.dataset.id] : (dr ? S.byId[S.drawerId] : null)
	if (act && a) {
		var t = act.dataset.act
		if (t === 'allow') resolvePermission(a, true, act)
		else if (t === 'deny') resolvePermission(a, false, act)
		else if (t === 'stop') stopAgent(a)
		else if (t === 'detail') openDrawer(a.id)
		return
	}
	if (e.target.closest('a')) return
	var head = e.target.closest('.head')
	if (head && a) toggleRow(a)
})
document.addEventListener('keydown', function (e) {
	if (e.key === 'Escape' && S.drawerId) { closeDrawer(); return }
	var head = e.target.closest && e.target.closest('.head')
	if (head && e.target === head && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); var a = S.byId[head.closest('.rowwrap').dataset.id]; if (a) toggleRow(a) }
})

/* ---------- панель деталей ---------- */
var lastFocus = null
function renderDrawer() {
	var a = S.byId[S.drawerId]; if (!a) return
	var k = kindOf(a), d = $('#drawer'), label = { work: 'Работает', start: 'Запускается', wait: 'Ждёт разрешения', error: 'Ошибка', done: 'Выполнено', stop: 'Остановлен' }[k]
	var rd = M.roles[a.role] || { name: a.role, hue: 220 }
	var cum = 0
	var tl = a.plan.map(function (p, i) {
		var tool = a.tools && a.tools[i], t3 = ''
		if (p.st === 'done') { cum += a.stepDur[i] || 30; t3 = 'готово · ' + fmtDur(a.stepDur[i] || 30) + ' · на ' + fmtDur(cum) + ' от старта' }
		else if (p.st === 'active') t3 = 'идёт <span class="timer" data-since="' + a.stepSince + '">' + fmtDur((Date.now() - a.stepSince) / 1000) + '</span>'
		else if (p.st === 'error') t3 = 'ошибка: ' + esc(a.error || '')
		else t3 = 'в очереди'
		return '<li class="' + (a.finishing && p.st === 'active' ? 'done' : p.st) + '"><span class="pt"></span><div class="t1">' + esc(p.text) + '</div>' + (tool && p.st !== 'todo' ? '<div class="t2">' + esc(tool) + '</div>' : '') + '<div class="t3">' + t3 + '</div></li>'
	}).join('')
	var cl = a.plan.map(function (p) { var st = a.finishing && p.st === 'active' ? 'done' : p.st; return '<li class="' + st + '">' + (st === 'done' ? CHECK : DOT) + '<span>' + esc(p.text) + '</span></li>' }).join('')
	var parent = a.parent && S.byId[a.parent] ? S.byId[a.parent].name : null
	var elapsed = a.doneAt && (k === 'done' || k === 'stop' || k === 'error') ? (a.duration || (a.doneAt - a.startedAt) / 1000) : null
	d.innerHTML = '<div class="dh"><span class="ico" data-k="' + k + '">' + iconHtml(a.finishing ? 'done' : k) + '</span><div class="tt"><b>' + esc(a.name) + '</b><span>' + label + ' · <span class="role" style="--h:' + rd.hue + '">' + esc(rd.name) + '</span></span></div><button class="xbtn" data-act="close" type="button" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>' +
		'<div class="db">' +
		(k === 'wait' ? '<div class="attn" style="padding:0;margin:0"><span class="badge pulse">Запрос разрешения</span><code>' + esc(a.permission) + '</code><span class="btns" style="width:100%;margin:0"><button class="btn primary" data-act="allow" type="button">Разрешить</button><button class="btn" data-act="deny" type="button">Отклонить</button></span></div>' : '') +
		(k === 'error' ? '<div class="attn" style="padding:0;margin:0"><span class="badge err">Ошибка</span><span class="errtxt">' + esc(a.error) + '</span></div>' : '') +
		'<div><h3>Сведения</h3><dl class="kv"><dt>Задача</dt><dd>' + esc(a.task) + '</dd><dt>Пространство</dt><dd>' + esc(a.space) + '</dd>' + (parent ? '<dt>Запущен агентом</dt><dd>' + esc(parent) + '</dd>' : '') +
		'<dt>Запущен</dt><dd>' + fmtAgo((Date.now() - a.startedAt) / 1000) + '</dd><dt>' + (elapsed != null ? 'Время работы' : 'В работе') + '</dt><dd>' + (elapsed != null ? fmtDur(elapsed) : '<span class="timer" data-since="' + a.startedAt + '">' + fmtDur((Date.now() - a.startedAt) / 1000) + '</span>') + '</dd><dt>Вызовов инструментов</dt><dd>' + a.steps + '</dd></dl></div>' +
		((k === 'work' || k === 'wait' || k === 'start') ? '<div><button class="btn danger" data-act="stop" type="button">Остановить агента</button></div>' : '') +
		((a.res && (k === 'done' || k === 'stop')) ? '<div class="res"><h3>Итоговый ответ</h3>' + resHtml(a.res).replace(/^<h4>[^<]*<\/h4>/, '') + '</div>' : '') +
		'<div><h3>План <span class="n">' + doneCount(a) + ' из ' + a.plan.length + '</span></h3><ul class="cl">' + cl + '</ul></div>' +
		'<div><h3>Шаги</h3><ol class="tl">' + tl + '</ol></div>' +
		'<div><details class="chat"><summary>Чат с агентом · 3 сообщения</summary><div class="bub"><small>Оркестратор</small>' + esc(a.task) + '</div><div class="bub"><small>' + esc(a.name) + '</small>' + md(a.lastMsg || (a.res && a.res.summary) || '') + '</div></details></div>' +
		'</div>'
}
function openDrawer(id) {
	S.drawerId = id; lastFocus = document.activeElement; renderDrawer()
	var d = $('#drawer'); d.setAttribute('aria-hidden', 'false'); requestAnimationFrame(function () { d.classList.add('open'); $('#scrim').classList.add('open'); var x = d.querySelector('.xbtn'); if (x) x.focus({ preventScroll: true }) })
}
function closeDrawer() {
	S.drawerId = null; var d = $('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open')
	if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }) } catch (e) {}
}

/* ---------- симуляция ---------- */
function advance(a) {
	var i = a.plan.findIndex(function (p) { return p.st === 'active' })
	if (i < 0 || i >= a.plan.length - 1) return false
	var now = Date.now()
	a.stepDur[i] = Math.max(8, Math.round((now - a.stepSince) / 1000) + 14 + i * 3)
	a.plan[i].st = 'done'; a.plan[i + 1].st = 'active'; a.fresh = i
	a.stepSince = now; a.toolSince = now; a.tool = (a.tools && a.tools[i + 1]) || a.tool; a.steps += 2
	a.lastMsg = 'Перешёл к шагу «' + a.plan[i + 1].text + '».'
	updateRow(a); a.fresh = null
	if (S.drawerId === a.id) renderDrawer()
	return true
}
function startAgent(a) {
	a.status = 'working'; a.plan[0].st = 'active'; a.stepSince = a.toolSince = Date.now(); a.tool = 'Wiki: чтение черновика wiki-deploy'; a.lastMsg = 'План составлен, приступаю.'
	updateRow(a); refresh(); if (S.drawerId === a.id) renderDrawer()
}
function finish(a) {
	var i = a.plan.findIndex(function (p) { return p.st === 'active' })
	if (i >= 0) { a.stepDur[i] = 21; a.fresh = i }
	a.permission = null; a.attention = null
	a.finishing = true; a.isNew = true
	a.plan.forEach(function (p) { if (p.st === 'active') p.st = 'done' })
	updateRow(a); a.fresh = null
	var r = rows[a.id]; r.row.classList.remove('flash'); void r.row.offsetWidth; r.row.classList.add('flash')
	if (S.drawerId === a.id) renderDrawer()
	later(function () {
		a.finishing = false; a.status = 'done'; a.doneAt = Date.now(); a.duration = (a.doneAt - a.startedAt) / 1000; a.steps += 3
		a.lastMsg = null; a.res = RES[a.id]
		if (!a.doneOpenedOnce) { a.doneOpenedOnce = true; S.openRows[a.id] = true; if (!S.hideDone) S.doneOpen = true }
		updateRow(a); place(a, true); refresh()
		if (S.drawerId === a.id) renderDrawer()
		toast(a.name + ': выполнено')
	}, reduce ? 0 : 1600)
}
var SEQ = ['a-fx01', 'a-wk05', 'a-wr06:start', 'a-fx01:finish', 'a-sc10', 'a-rn11', 'a-da12', 'a-wk05', 'a-sc10', 'a-da12', 'a-rn11']
function simStep() {
	var s = SEQ[S.seq % SEQ.length]; S.seq++
	var id = s.split(':')[0], mode = s.split(':')[1], a = S.byId[id]
	if (!a || a.finishing || a.status === 'stopped') return
	if (mode === 'finish') finish(a)
	else if (mode === 'start') { if (a.status === 'starting') startAgent(a) }
	else if (a.status === 'working') advance(a)
}
function startSim() {
	if (/nosim/.test(location.search)) return
	S.simId = setInterval(simStep, 4000)
}
function tick() {
	var now = Date.now()
	document.querySelectorAll('.timer[data-since]').forEach(function (el) { var t = fmtDur((now - Number(el.dataset.since)) / 1000); if (el.textContent !== t) el.textContent = t })
	document.querySelectorAll('.ago[data-at]').forEach(function (el) { var t = fmtAgo((now - Number(el.dataset.at)) / 1000); if (el.textContent !== t) el.textContent = t })
}

/* ---------- запуск ---------- */
function setTheme(t) {
	document.documentElement.dataset.theme = t; store('v4a.theme', t)
	$('#themeTxt').textContent = t === 'dark' ? 'Светлая' : 'Тёмная'
}
function init() {
	lists = { needs: $('#l-needs'), work: $('#l-work'), done: $('#l-done') }
	Object.keys(lists).forEach(function (k) { lists[k].innerHTML = '' })
	rows = {}; lastCounts = {}
	S.agents = buildAgents(); S.byId = {}; S.agents.forEach(function (a) { S.byId[a.id] = a })
	S.openRows = {}; S.seq = 0; S.drawerId = null
	$('#chips').innerHTML = ''
	closeDrawer()
	viewAll()
}
function restart() {
	S.timers.forEach(clearTimeout); S.timers = []; clearInterval(S.simId)
	S.filter = null
	init(); startSim(); toast('Демо перезапущено')
}
var th = store('v4a.theme'); setTheme(th === 'light' ? 'light' : 'dark')
S.compact = store('v4a.compact') === '1'; S.hideDone = store('v4a.hide') === '1'; S.doneOpen = store('v4a.doneOpen') === '1'
init(); startSim(); setInterval(tick, 1000)
window.addEventListener('scroll', function () { $('#toolbar').classList.toggle('stuck', window.scrollY > 70) }, { passive: true })
window.__nessy = { restart: restart, step: simStep, state: S }
})()
</script>
