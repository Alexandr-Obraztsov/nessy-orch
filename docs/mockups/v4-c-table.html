<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nessy-orch — Вариант C: Таблица</title>
<style>
/* ============ ДИЗАЙН-ТОКЕНЫ (v4) ============ */
:root{
	/* 4px-сетка */
	--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--space-8:40px;
	/* типошкала */
	--text-xs:11px;--text-sm:12px;--text-base:13px;--text-md:14px;--text-lg:16px;--text-xl:20px;
	--lh-tight:1.25;--lh-base:1.45;--lh-loose:1.6;
	--font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
	--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
	/* радиусы */
	--radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-pill:999px;
	/* движение */
	--dur-fast:120ms;--dur-base:200ms;--dur-slow:360ms;
	--ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
	/* размеры */
	--row-h:40px;--colh:32px;--gh:32px;--panel-w:440px;
}
:root,:root[data-theme="dark"]{
	color-scheme:dark;
	--gray-0:#0b0d11;--gray-1:#10131a;--gray-2:#161a23;--gray-3:#1c212c;--gray-4:#252b39;--gray-5:#2f3647;
	--gray-6:#3d455b;--gray-7:#525b75;--gray-8:#6f7992;--gray-9:#8f98ad;--gray-10:#adb4c4;--gray-11:#cfd4df;--gray-12:#eff1f6;
	--accent:#6ea8ff;--accent-ink:#0b1220;
	--working:#5aa2ff;--wait:#f5b544;--error:#ff6b6b;--done:#4cc38a;--stopped:#8f98ad;
	--bg:var(--gray-0);--surface:var(--gray-1);--surface-2:var(--gray-2);--hover:var(--gray-3);
	--border:var(--gray-4);--border-soft:#1b202b;--text:var(--gray-12);--text-2:var(--gray-10);--text-3:var(--gray-9);
	--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 12px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
	--on-status:#0b0d11;
}
:root[data-theme="light"]{
	color-scheme:light;
	--gray-0:#f4f6f9;--gray-1:#ffffff;--gray-2:#f0f2f6;--gray-3:#e7eaf0;--gray-4:#dce0e8;--gray-5:#ccd2dc;
	--gray-6:#b3bbc9;--gray-7:#8e98ab;--gray-8:#677184;--gray-9:#566073;--gray-10:#3f4858;--gray-11:#2a3140;--gray-12:#12161f;
	--accent:#1f6feb;--accent-ink:#fff;
	--working:#1f6feb;--wait:#a86400;--error:#d1242f;--done:#1a7f4b;--stopped:#677184;
	--bg:var(--gray-0);--surface:var(--gray-1);--surface-2:var(--gray-2);--hover:var(--gray-3);
	--border:var(--gray-4);--border-soft:#e9ecf1;--text:var(--gray-12);--text-2:var(--gray-10);--text-3:var(--gray-8);
	--shadow-1:0 1px 2px rgba(20,30,50,.08);--shadow-2:0 12px 40px rgba(20,30,50,.16),0 2px 6px rgba(20,30,50,.08);
	--on-status:#fff;
}

/* ============ БАЗА ============ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--text-base)/var(--lh-base) var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
code,.mono{font-family:var(--font-mono);font-size:.92em}
code{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:0 4px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--gray-5);border-radius:8px;border:3px solid transparent;background-clip:content-box}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-width:0}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:var(--space-3);min-height:48px;padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--border);background:var(--surface);flex:none;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:var(--space-2)}
.brand svg{width:18px;height:18px;color:var(--accent)}
.vtag{font-size:var(--text-xs);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:var(--radius-pill);padding:2px 10px;white-space:nowrap;font-weight:600}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-2);font-size:var(--text-sm);white-space:nowrap;transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn:hover{background:var(--hover);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px}
.switch{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 8px;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-2);font-size:var(--text-sm);white-space:nowrap}
.switch:hover{background:var(--hover)}
.switch .trk{width:26px;height:14px;border-radius:var(--radius-pill);background:var(--gray-5);position:relative;transition:background var(--dur-base)}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--gray-12);transition:transform var(--dur-base) var(--ease-spring)}
.switch[aria-checked=true]{color:var(--text)}
.switch[aria-checked=true] .trk{background:var(--accent)}
.switch[aria-checked=true] .trk::after{transform:translateX(12px);background:#fff}

/* ---------- сводка-фильтры ---------- */
.sumbar{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--border-soft);background:var(--bg);flex:none;overflow-x:auto;scrollbar-width:none}
.sumbar::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 10px;border:1px solid var(--border);border-radius:var(--radius-pill);color:var(--text-2);font-size:var(--text-sm);white-space:nowrap;background:var(--surface);transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.chip:hover{background:var(--hover)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gray-7))}
.chip b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums;display:inline-block}
.chip[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--text)}
.chip.zero{opacity:.55}
.chip.bump b{animation:bump var(--dur-slow) var(--ease-spring)}
.hint{margin-left:auto;color:var(--text-3);font-size:var(--text-xs);white-space:nowrap;display:flex;gap:var(--space-2);align-items:center}
kbd{font:600 var(--text-xs)/1 var(--font-mono);padding:2px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--radius-sm);color:var(--text-2);background:var(--surface)}

/* ---------- основная раскладка ---------- */
.main{flex:1;min-height:0;display:flex}
.tw{flex:1;min-width:0;overflow:auto;container:tw/inline-size;position:relative;background:var(--bg);scroll-behavior:smooth}
.panel{flex:none;width:0;overflow:hidden;border-left:1px solid transparent;background:var(--surface);transition:width var(--dur-slow) var(--ease-out),border-color var(--dur-slow)}
.app.has-panel .panel{width:var(--panel-w);border-left-color:var(--border)}
.panel-in{width:var(--panel-w);height:100%;overflow:auto;display:flex;flex-direction:column}
.scrim{display:none}

/* ---------- таблица ---------- */
.colhead,.row{display:grid;grid-template-columns:28px minmax(140px,180px) minmax(120px,1.1fr) minmax(230px,1.6fr) minmax(150px,1.1fr) 56px 264px;column-gap:var(--space-3);align-items:center;padding:0 var(--space-4) 0 var(--space-3)}
.colhead{position:sticky;top:0;z-index:6;height:var(--colh);background:var(--surface);border-bottom:1px solid var(--border);font-size:var(--text-xs);color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.colhead .c-tm{text-align:right}
.grp{position:relative}
.gh{position:sticky;top:var(--colh);z-index:5;height:var(--gh);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4) 0 var(--space-2);background:color-mix(in srgb,var(--bg) 88%,var(--surface-2));border-bottom:1px solid var(--border-soft);font-size:var(--text-sm);font-weight:650;cursor:pointer;user-select:none;overflow:hidden;transition:height var(--dur-base) var(--ease-out),opacity var(--dur-base),border-color var(--dur-base);backdrop-filter:blur(6px)}
.gh:hover{background:var(--hover)}
.gh .chev{width:20px;height:20px;display:grid;place-items:center;color:var(--text-3);transition:transform var(--dur-base) var(--ease-out)}
.gh .chev svg{width:12px;height:12px}
.grp.collapsed .gh .chev{transform:rotate(-90deg)}
.gh .gn{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-pill);padding:0 8px;font-size:var(--text-xs);color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:600;min-width:22px;text-align:center}
.gh .gn.bump{animation:bump var(--dur-slow) var(--ease-spring)}
.gh .gnote{margin-left:auto;font-weight:400;color:var(--text-3);font-size:var(--text-xs)}
.gh .gi{width:8px;height:8px;border-radius:50%;background:var(--c)}
.grp.is-off .gh{height:0;opacity:0;border-color:transparent}
.gb{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--dur-slow) var(--ease-out),opacity var(--dur-base)}
.gbi{min-height:0;overflow:hidden}
.grp.collapsed .gb,.grp.is-off .gb{grid-template-rows:0fr;opacity:0}
.grp.is-empty{display:none}

.row{position:relative;height:var(--row-h);border-bottom:1px solid var(--border-soft);background:var(--bg);cursor:pointer;outline:none;scroll-margin-top:calc(var(--colh) + var(--gh) + 4px);transition:background var(--dur-fast)}
.row:hover{background:var(--surface-2)}
.row.cur{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 60%,transparent)}
.row.sel{background:color-mix(in srgb,var(--accent) 11%,var(--bg))}
.row.f-off{display:none}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background var(--dur-base),opacity var(--dur-slow)}
.row[data-s=wait]{background:color-mix(in srgb,var(--wait) 7%,var(--bg))}
.row[data-s=wait] .bar{background:var(--wait)}
.row[data-s=error]{background:color-mix(in srgb,var(--error) 6%,var(--bg))}
.row[data-s=error] .bar{background:var(--error)}
.row[data-s=wait].sel,.row[data-s=error].sel{background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.row > span{min-width:0}
.c-st{display:grid;place-items:center}
.c-ag{display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:var(--lh-tight)}
.nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.rl{font-size:var(--text-xs);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.rl i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 65% 60%);flex:none}
.newtag{font-size:10px;font-weight:700;color:var(--done);background:color-mix(in srgb,var(--done) 16%,transparent);border-radius:var(--radius-pill);padding:0 6px;line-height:15px;animation:popin var(--dur-slow) var(--ease-spring)}
.c-tk{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pr{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.segs{display:flex;gap:2px;width:88px;flex:none;height:4px}
.seg{flex:1;background:var(--gray-5);border-radius:2px;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;background:var(--working);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform 700ms var(--ease-out),background var(--dur-slow)}
.seg.d i{transform:scaleX(1)}
.seg.a i{transform:scaleX(.5);animation:segpulse 1.6s ease-in-out infinite}
.seg.e i{transform:scaleX(.5);background:var(--error)}
.row[data-s=done] .seg.d i,.p-done .seg.d i{background:var(--done)}
.row[data-s=stopped] .seg.d i{background:var(--stopped)}
.row[data-s=wait] .seg.a i{background:var(--wait)}
.segs.ind{background:var(--gray-5);border-radius:2px;overflow:hidden;position:relative}
.segs.ind::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--working),transparent);animation:shimmer 1.4s linear infinite}
.segs.off{opacity:.35}
.cnt{font:600 var(--text-sm)/1 var(--font-mono);color:var(--text);font-variant-numeric:tabular-nums;flex:none;min-width:28px}
.stp{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp-perm,.sp-res{display:none}
.c-nw{display:flex;align-items:center;gap:var(--space-2);min-width:0;font-size:var(--text-sm)}
.tn{font-weight:650;color:var(--text);flex:none;font-size:var(--text-sm)}
.ta{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tmr{font:600 var(--text-xs)/1 var(--font-mono);color:var(--working);font-variant-numeric:tabular-nums;margin-left:auto;flex:none;padding-left:4px}
.dim{color:var(--text-3)}
.warnx{color:var(--wait);font-weight:650}
.errx{color:var(--error)}
.permx{display:inline-flex;align-items:center;gap:6px;min-width:0}
.badge{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:var(--radius-pill);padding:0 7px;line-height:17px;flex:none;color:var(--on-status);background:var(--wait);animation:badgepulse 2s ease-in-out infinite}
.c-tm{text-align:right;font:var(--text-sm)/1 var(--font-mono);color:var(--text-2);font-variant-numeric:tabular-nums}
.c-ac{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;border:1px solid var(--border);color:var(--text-2);background:var(--surface);white-space:nowrap;transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast) var(--ease-spring)}
.ab svg{width:12px;height:12px;flex:none}
.ab:hover{background:var(--hover);color:var(--text)}
.ab:active{transform:scale(.94)}
.ab.ok{background:var(--done);border-color:var(--done);color:var(--on-status)}
.ab.ok:hover{filter:brightness(1.08)}
.ab.stop:hover,.ab.armed{border-color:var(--error);color:var(--error)}
.ab.armed{background:color-mix(in srgb,var(--error) 12%,var(--surface));animation:popin var(--dur-base) var(--ease-spring)}
.ab.okd{animation:okpop 520ms var(--ease-spring);background:var(--done);color:var(--on-status);border-color:var(--done)}
.ab.nod{animation:shake 360ms}
.row .hov{opacity:0;transform:translateX(4px);transition:opacity var(--dur-fast),transform var(--dur-base) var(--ease-out);pointer-events:none}
.row:hover .hov,.row:focus-within .hov,.row.cur .hov{opacity:1;transform:none;pointer-events:auto}
.row[data-s=wait] .hov{opacity:1;transform:none;pointer-events:auto}
.row.is-new{animation:newflash 1.5s var(--ease-out)}
.row.flash-ok{animation:okflash 800ms var(--ease-out)}
.empty{padding:var(--space-8) var(--space-4);text-align:center;color:var(--text-3)}

/* ---------- иконка статуса ---------- */
.sti{width:20px;height:20px;display:block;position:relative;--c:var(--working)}
.sti svg{width:20px;height:20px;overflow:visible;display:block}
.sti .ring{fill:transparent;stroke:var(--c);stroke-width:1.5;stroke-opacity:.35;transition:fill var(--dur-base),stroke var(--dur-base),stroke-opacity var(--dur-base)}
.sti .spin{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:11 33;transform-origin:10px 10px;animation:spin 900ms linear infinite;opacity:0;transition:opacity var(--dur-base)}
.sti .chk,.sti .xx{fill:none;stroke:var(--on-status);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset 380ms var(--ease-out) 120ms}
.sti .xx{stroke-dasharray:20;stroke-dashoffset:20}
.sti .dot{fill:var(--c);opacity:0;transform-origin:10px 10px;transition:opacity var(--dur-base)}
.sti .sq{fill:var(--c);opacity:0;transition:opacity var(--dur-base)}
.sti .pulse{fill:var(--c);opacity:0;transform-origin:10px 10px}
.sti[data-s=working] .spin{opacity:1}
.sti[data-s=starting]{--c:var(--gray-8)}
.sti[data-s=starting] .spin{opacity:1;stroke-dasharray:2 5}
.sti[data-s=wait]{--c:var(--wait)}
.sti[data-s=wait] .ring{stroke-opacity:.6}
.sti[data-s=wait] .dot{opacity:1;animation:dotpulse 1.8s ease-in-out infinite}
.sti[data-s=wait] .pulse{animation:ping 1.8s ease-out infinite}
.sti[data-s=error]{--c:var(--error)}
.sti[data-s=error] .ring{fill:var(--c);stroke-opacity:1}
.sti[data-s=error] .xx{stroke-dashoffset:0}
.sti[data-s=done]{--c:var(--done)}
.sti[data-s=done] .ring{fill:var(--c);stroke-opacity:1}
.sti[data-s=done] .chk{stroke-dashoffset:0}
.sti[data-s=stopped]{--c:var(--stopped)}
.sti[data-s=stopped] .sq{opacity:1}
.sti[data-s=idle]{--c:var(--gray-8)}
.sti[data-s=idle] .ring{stroke-dasharray:3 3;stroke-opacity:.8}

/* ---------- панель деталей ---------- */
.p-head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--border);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3)}
.p-head .ttl{min-width:0;flex:1}
.p-head .ttl b{font-size:var(--text-lg);display:block;line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-head .ttl span{font-size:var(--text-xs);color:var(--text-3);display:flex;gap:6px;align-items:center}
.p-head .ttl .rl{font-size:var(--text-xs)}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-3);transition:background var(--dur-fast),color var(--dur-fast)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn svg{width:14px;height:14px}
.p-sec{padding:var(--space-4);border-bottom:1px solid var(--border-soft)}
.p-sec h4{margin:0 0 var(--space-2);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);font-weight:650;display:flex;align-items:center;gap:var(--space-2)}
.p-sec h4 em{font-style:normal;margin-left:auto;font-family:var(--font-mono);color:var(--text-2);text-transform:none;letter-spacing:0;font-size:var(--text-sm)}
.p-task{font-size:var(--text-md);font-weight:600;line-height:var(--lh-base)}
.p-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:var(--text-xs);color:var(--text-3)}
.p-meta b{color:var(--text-2);font-weight:600}
.p-prog{display:flex;align-items:center;gap:var(--space-3)}
.p-prog .segs{width:auto;flex:1;height:6px;gap:3px}
.p-prog .seg{border-radius:3px}.p-prog .seg i{border-radius:3px}
.p-prog .cnt{font-size:var(--text-md)}
.p-step{margin-top:var(--space-2);color:var(--text-2);font-size:var(--text-sm)}
.p-now{margin-top:var(--space-2);display:flex;align-items:center;gap:var(--space-2);padding:6px 10px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border-soft)}
.alert{margin:var(--space-4);margin-bottom:0;padding:var(--space-3);border-radius:var(--radius-lg);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--surface));animation:slidedown var(--dur-slow) var(--ease-out)}
.alert.warn{--c:var(--wait)}.alert.err{--c:var(--error)}
.alert b{display:flex;align-items:center;gap:var(--space-2);color:var(--c);font-size:var(--text-sm)}
.alert code{display:block;margin:var(--space-2) 0;padding:6px 8px;word-break:break-all;background:var(--bg)}
.alert .acts{display:flex;gap:var(--space-2)}
.plan{list-style:none;margin:0;padding:0}

			pl_.innerHTML = a.plan.map(p => `<li><span class="bx"><svg viewBox="0 0 18 18"><circle class="cir" cx="9" cy="9" r="7.5"/><circle class="core" cx="9" cy="9" r="3"/><path class="tick" d="M5.4 9.3l2.4 2.4 4.6-5"/></svg></span><span class="pt">${esc(p.t)}</span></li>`).join('')
		}
		const act = activeIdx(a)
		;[...pl_.children].forEach((li, i) => {
			const cls = i < a.cur ? 'd' : i === act ? 'a' + (s === 'error' ? ' err' : s === 'wait' ? ' wt' : '') : ''
			if (li.className !== cls) li.className = cls
		})
	}
	// шаги
	const tl = P.tl
	const upto = a.status === 'done' ? a.plan.length : Math.min(a.plan.length, a.cur + (activeIdx(a) >= 0 ? 1 : 0))
	let t0 = 0
	const offs = a.plan.map(p => { const o = t0; t0 += p.dur || 20; return o })
	if (!a.plan.length) tl.innerHTML = '<li class="noanim"><i></i><div class="l1"><span class="dim">Шагов пока нет</span></div></li>'
	else {
		if (tl.dataset.plan !== '1') { tl.innerHTML = ''; tl.dataset.plan = '1' }
		for (let i = 0; i < upto; i++) {
			let li = tl.children[i]
			if (!li) { li = document.createElement('li'); if (first) li.className = 'noanim'; tl.appendChild(li) }
			const p = a.plan[i]
			const state = i < a.cur ? '' : (s === 'error' ? 'e' : s === 'wait' ? 'w' : 'a')
			const [n, arg] = p.tool ? splitTool(p.tool) : ['Думает', '']
			const dur = state ? (a.status === 'error' ? 'ошибка' : `<span data-tm="stepdur">${fmt((Date.now() - a.toolStart) / 1000)}</span>`) : (p.dur ? fmt(p.dur) : '')
			const html = `<div class="l1"><span class="tn">${esc(n)}</span><span class="ta" title="${esc(arg)}">${esc(arg)}</span><span class="dur">${dur}</span></div><div class="l2">${esc(p.t)} · +${fmt(offs[i])}</div>`
			const k = state + html
			if (li.dataset.k !== k) { li.dataset.k = k; const c = li.className.includes('noanim') ? ' noanim' : ''; li.className = state + c; li.innerHTML = `<i></i>${html}` }
		}
		while (tl.children.length > upto) tl.lastChild.remove()
	}
	// итог
	const sres = $('#s-res'), res = a.result
	const rk = a.status + (res ? '1' : '0')
	if (P.resKey !== rk) {
		P.resKey = rk
		if ((a.status === 'done' || a.status === 'stopped') && res) {
			sres.hidden = false
			$('#p-res').innerHTML = resHTML(a, res)
			if (first) $('#p-res .res').style.animation = 'none'
		} else sres.hidden = true
	}
	// чат
	const ck = a.status
	if (P.chatKey !== ck) {
		P.chatKey = ck
		const m = [['me', 'Оркестратор', `Поручение: ${a.task}`], ['', a.name, a.plan.length ? `Принял. План из ${a.plan.length} шагов, начинаю.` : 'Принял, запускаюсь.']]
		if (a.perm) m.push(['', a.name, `Нужно разрешение: \`${a.perm}\``])
		if (a.status === 'done' && res) m.push(['', a.name, res.sum])
		if (a.status === 'stopped') m.push(['me', 'Оркестратор', 'Остановить агента.'])
		$('#p-chat').innerHTML = m.map(([c, w, t]) => `<div class="msg ${c}"><small>${esc(w)}</small>${md(t)}</div>`).join('')
	}
}
function resHTML(a, r) {
	const host = u => { try { return new URL(u).hostname } catch { return u } }
	const letters = h => h.startsWith('gitlab') ? 'GL' : h.startsWith('jira') ? 'JI' : h.startsWith('wiki') ? 'WK' : h.startsWith('sage') ? 'SG' : h[0].toUpperCase()
	const hue = h => h.startsWith('gitlab') ? 18 : h.startsWith('jira') ? 215 : h.startsWith('wiki') ? 150 : h.startsWith('sage') ? 280 : 200
	const chips = (r.src || []).map(([t, u]) => { const h = host(u); return `<a class="src" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}"><span class="fv" style="--h:${hue(h)}">${letters(h)}</span><span class="st">${esc(t)}</span><span class="sh">${esc(h)}</span>${IC_EXT}</a>` }).join('')
	const tbl = r.tbl ? `<table><thead><tr>${r.tbl.h.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.tbl.r.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''
	return `<div class="res ${a.status === 'stopped' ? 'stopped' : ''}"><p class="sum">${md(r.sum)}</p>${r.pts ? `<ul>${r.pts.map(p => `<li>${md(p)}</li>`).join('')}</ul>` : ''}${tbl}${chips ? `<h5>Источники · ${r.src.length}</h5><div class="srcs">${chips}</div>` : ''}</div>`
}

/* ---------- действия ---------- */
function allow(a, ok) {
	const btns = document.querySelectorAll(`[data-act="${ok ? 'allow' : 'deny'}"][data-id="${a.id}"]`)
	btns.forEach(b => { b.classList.add(ok ? 'okd' : 'nod'); if (ok) b.innerHTML = IC_OK + 'Разрешено' })
	const r = rows.get(a.id)
	setTimeout(() => {
		if (!a.perm) return
		a.perm = null; a.toolStart = Date.now()
		if (!ok) a.tool = 'Думает…'
		if (!ok) a.tool = ''
		r.el.classList.remove('flash-ok'); void r.el.offsetWidth; if (ok) r.el.classList.add('flash-ok')
		updateRow(a); updatePanel(a); refresh()
	}, reduced ? 0 : 520)
}
function stop(a, btn) {
	if (!btn.classList.contains('armed')) {
		btn.classList.add('armed'); btn.dataset.html = btn.innerHTML; btn.innerHTML = IC_STOP + 'Точно?'
		const hv = btn.closest('.hov'); if (hv) hv.style.opacity = 1
		setTimeout(() => { if (btn.isConnected && btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.innerHTML = btn.dataset.html; if (hv) hv.style.opacity = '' } }, 2600)
		return
	}
	a.perm = null; a.status = 'stopped'; a.finishedAt = Date.now(); a.dur = (a.finishedAt - a.startedAt) / 1000
	a.result = { sum: 'Остановлен пользователем', pts: [`Выполнено шагов: ${a.cur}${a.plan.length ? ' из ' + a.plan.length : ''}`, 'Незавершённая работа не сохранена'] }
	updateRow(a); updatePanel(a); applyFilter()
	setTimeout(() => moveToDone(a), 500)
}
function moveToDone(a) {
	const r = rows.get(a.id), el = r.el, dst = $('#rows-done')
	if (el.parentElement === dst) return
	const h = el.offsetHeight
	if (reduced) { dst.prepend(el); refresh(); return }
	el.style.overflow = 'hidden'; el.style.height = h + 'px'; void el.offsetHeight
	el.style.transition = 'height 340ms var(--ease-out), opacity 240ms, border-color 340ms'
	el.style.height = '0px'; el.style.opacity = '0'; el.style.borderColor = 'transparent'
	setTimeout(() => {
		el.style.transition = 'none'; el.style.height = ''; el.style.opacity = '0'
		dst.prepend(el)
		const nat = el.offsetHeight
		el.style.height = '0px'; void el.offsetHeight
		el.style.transition = 'height 380ms var(--ease-out), opacity 380ms'
		el.style.height = nat + 'px'; el.style.opacity = '1'
		setTimeout(() => { el.style.cssText = ''; refresh() }, 420)
		applyFilter()
	}, 360)
}

/* ---------- симуляция ---------- */
function advance(a) {
	if (!a || a.status !== 'working' || a.cur >= a.plan.length - 1) return
	a.cur++
	a.toolStart = Date.now(); a.tool = a.plan[a.cur].tool
	updateRow(a); updatePanel(a)
}
function complete(a) {
	if (a.status !== 'working') return
	a.perm = null; a.cur = a.plan.length; a.status = 'done'
	a.finishedAt = Date.now(); a.dur = (a.finishedAt - a.startedAt) / 1000; a.tool = ''
	a.result = RESULTS[a.id] || FIXCI_RESULT
	updateRow(a); updatePanel(a)
	const r = rows.get(a.id)
	r.el.classList.add('is-new')
	const tag = document.createElement('span'); tag.className = 'newtag'; tag.textContent = 'новое'; r.nmt.appendChild(tag)
	renderChips()
	setTimeout(() => { r.el.classList.remove('is-new'); moveToDone(a) }, reduced ? 0 : 1500)
	setTimeout(() => tag.remove(), 9000)
}
function simTick() {
	simT++
	const by = id => agents.find(a => a.id === id)
	if (simT % 4 === 0) {
		const order = ['a-fx01', 'a-wk05', 'a-mr12', 'a-ep13', 'a-sr14', 'a-wa15']
		advance(by(order[(simT / 4 - 1) % order.length]))
	}
	if (simT === 9 && by('a-fx01').perm) allow(by('a-fx01'), true)
	if (simT === 12) complete(by('a-fx01'))
	if (simT === 20) { const w = by('a-wr06'); if (w.status === 'starting') { w.status = 'working'; w.toolStart = Date.now(); w.tool = w.plan[0].tool; updateRow(w); updatePanel(w); refresh() } }
}
function tick() {
	agents.forEach(tickRow)
	if (P) {
		const a = agents.find(x => x.id === P.id)
		document.querySelectorAll('#panelIn [data-tm=tool],#panelIn [data-tm=stepdur]').forEach(e => { e.textContent = fmt((Date.now() - a.toolStart) / 1000) })
		const el = $('#panelIn [data-tm=el]'); if (el && a.status !== 'done' && a.status !== 'stopped' && a.status !== 'error') el.textContent = fmt(elapsed(a))
	}
	simTick()
}

/* ---------- запуск ---------- */
function start() {
	clearInterval(tickTimer); pending.forEach(clearTimeout)
	simT = 0; selId = null; curId = null; filter = 'all'; P = null; lastCounts = {}
	$('#app').classList.remove('has-panel')
	$('#rows-work').innerHTML = ''; $('#rows-done').innerHTML = ''
	rows = new Map(); agents = makeAgents()
	document.querySelectorAll('.grp').forEach(g => g.classList.remove('collapsed'))
	for (const g of ['work', 'done']) desiredOrder(g).forEach(a => $('#rows-' + g).appendChild(buildRow(a)))
	applyFilter()
	tickTimer = setInterval(tick, 1000)
}
window.__demo = { restart: start, get t() { return simT }, select, agents: () => agents }

/* ---------- события ---------- */
document.addEventListener('click', e => {
	const act = e.target.closest('[data-act]')
	if (act) {
		e.stopPropagation()
		const a = agents.find(x => x.id === act.dataset.id); if (!a) return
		if (act.dataset.act === 'allow') allow(a, true)
		else if (act.dataset.act === 'deny') allow(a, false)
		else if (act.dataset.act === 'stop') stop(a, act)
		return
	}
	if (e.target.closest('a')) return
	const chip = e.target.closest('.chip')
	if (chip) { filter = filter === chip.dataset.f ? 'all' : chip.dataset.f; applyFilter(); return }
	const gh = e.target.closest('.gh')
	if (gh) { gh.parentElement.classList.toggle('collapsed'); return }
	const row = e.target.closest('.row')
	if (row) { select(row.dataset.id); row.focus({ preventScroll: true }); return }
	if (e.target.closest('#scrim')) closePanel()
})
$('#hideDone').addEventListener('click', () => { hideDone = !hideDone; store.set('v4c.hideDone', hideDone ? '1' : '0'); applyFilter() })
$('#restart').addEventListener('click', start)
const root = document.documentElement
const setTheme = t => { root.dataset.theme = t; store.set('v4c.theme', t) }
$('#theme').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'))
document.addEventListener('keydown', e => {
	if (e.metaKey || e.ctrlKey || e.altKey) return
	if (e.key === 'Escape') { if (selId) { closePanel(); e.preventDefault() } return }
	const inCtl = e.target.closest && e.target.closest('button,a,summary,input')
	if (e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
		if (e.key.startsWith('Arrow') && inCtl) return
		const v = visibleRows(); if (!v.length) return
		const down = e.key === 'j' || e.key === 'ArrowDown'
		let i = v.findIndex(x => x.dataset.id === curId)
		i = i < 0 ? 0 : Math.max(0, Math.min(v.length - 1, i + (down ? 1 : -1)))
		const id = v[i].dataset.id
		e.preventDefault()
		if (selId) select(id); else setCursor(id)
		v[i].focus({ preventScroll: true }); v[i].scrollIntoView({ block: 'nearest' })
	} else if (e.key === 'Enter' && !inCtl) {
		if (curId) { e.preventDefault(); select(curId) }
	}
})
const saved = store.get('v4c.theme'); if (saved === 'light' || saved === 'dark') root.dataset.theme = saved
start()
})()
