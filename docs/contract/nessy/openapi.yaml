openapi: 3.0.0
paths:
  /health/liveness:
    get:
      operationId: HealthController_liveness
      parameters: []
      responses:
        '200':
          description: ''
      summary: Liveness probe
      tags:
        - health
  /health/readiness:
    get:
      operationId: HealthController_readiness
      parameters: []
      responses:
        '200':
          description: ''
      summary: Readiness probe
      tags:
        - health
  /v1/skills:
    get:
      operationId: SkillsController_list_v1
      parameters:
        - name: domain
          required: false
          in: query
          description: Filter by persisted taxonomy domain
          schema:
            type: string
        - name: subdomain
          required: false
          in: query
          description: Filter by persisted taxonomy subdomain
          schema:
            type: string
        - name: q
          required: false
          in: query
          description: Full-text search across name, description, author
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number, starting from 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          required: false
          in: query
          description: Skills per page. The backend caps the value at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          required: false
          in: query
          description: Sort order for skills.
          schema:
            type: string
            enum:
              - installs
              - name
              - tenant
            default: installs
        - name: withDescription
          required: false
          in: query
          description: Only skills with a non-empty description
          schema: {}
        - name: profession
          required: false
          in: query
          description: Filter by approved profession
          schema:
            type: array
            items:
              type: string
        - name: phase
          required: false
          in: query
          description: Filter by lifecycle phase
          schema:
            type: array
            items:
              type: string
        - name: tenant
          required: false
          in: query
          description: Filter by tenant slug
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          headers:
            X-Total-Count:
              description: Total matching skills
              schema:
                type: integer
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDto'
      summary: List skills (filter via query)
      tags:
        - skills
  /v1/skills/facets:
    get:
      operationId: SkillsController_facets_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillFacetsResponseDto'
      summary: Catalog filter options for skills
      tags:
        - skills
  /v1/skills/{id}/files:
    get:
      operationId: SkillsController_files_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: include
          required: false
          in: query
          description: 'Comma-separated content classes: text,binary,script,asset,manifest.'
          schema:
            type: string
        - name: path
          required: false
          in: query
          description: Optional canonical relative path prefix.
          schema:
            type: string
      responses:
        '200':
          description: Skill file inventory
        '404':
          description: Skill or content not found
        '503':
          description: Skill source unavailable
      summary: List files available in one Skill package
      tags:
        - skills
  /v1/skills/{id}/content:
    get:
      operationId: SkillsController_contentFile_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: path
          required: false
          in: query
          description: Canonical relative file path. Defaults to SKILL.md.
          schema:
            type: string
            default: SKILL.md
      responses:
        '200':
          description: Raw Skill file bytes
        '400':
          description: Invalid path
        '404':
          description: Skill or file not found
        '503':
          description: Skill source unavailable
      summary: Get one file from a Skill package. Defaults to SKILL.md.
      tags:
        - skills
  /v1/skills/{id}/archive.zip:
    get:
      operationId: SkillsController_archiveZip_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Zip archive with the full Skill tree
        '404':
          description: Skill or content not found
        '503':
          description: Skill source unavailable
      summary: Download one Skill package as a zip archive
      tags:
        - skills
  /v1/skills/{id}:
    get:
      operationId: SkillsController_byId_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '404':
          description: Skill not found
      summary: Get one skill by slug
      tags:
        - skills
  /v1/skills/{id}/variants:
    get:
      operationId: SkillCanonicalSourceController_variants_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillVariantDto'
        '404':
          description: Skill not found
      summary: List source variants for a collapsed Skill cluster
      tags:
        - skills
  /v1/skills/{id}/canonical-source:
    post:
      operationId: SkillCanonicalSourceController_setCanonicalSource_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalSourceRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '403':
          description: Canonical source management access is required
        '404':
          description: Skill or source variant not found
        '409':
          description: Canonical source lock already exists
      summary: Choose canonical source variant for a collapsed Skill cluster
      tags:
        - skills
    delete:
      operationId: SkillCanonicalSourceController_resetCanonicalSource_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '403':
          description: Skill Market admin access is required
        '404':
          description: Skill not found
      summary: Reset canonical source lock for a collapsed Skill cluster
      tags:
        - skills
  /v1/catalog:
    get:
      operationId: CatalogController_full_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
      summary: Full baked snapshot
      tags:
        - catalog
  /v1/meta:
    get:
      operationId: CatalogController_meta_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogMetaDto'
      summary: Catalog meta
      tags:
        - catalog
  /v1/plugins:
    get:
      operationId: CatalogController_plugins_v1
      parameters:
        - name: page
          required: false
          in: query
          description: >-
            Page number, starting from 1. Use Try it out with the default value
            to fetch current extensions.
          schema:
            type: integer
            minimum: 1
            default: 1
          examples:
            First page:
              value: 1
              summary: Current catalog first page
            Second page:
              value: 2
              summary: Next page
        - name: pageSize
          required: false
          in: query
          description: Extensions per page. The backend caps the value at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          examples:
            Default page size:
              value: 20
              summary: Default
            Compact page:
              value: 5
              summary: Small page for quick inspection
            Max page:
              value: 100
              summary: Maximum accepted value
        - name: kind
          required: false
          in: query
          description: Plugin kind. Current catalog supports Nessy extensions.
          schema:
            type: string
            enum:
              - nessy-extension
            default: nessy-extension
        - name: q
          required: false
          in: query
          description: >-
            Full-text search across plugin name, description, path, and
            capabilities.
          schema:
            type: string
        - name: capabilities
          required: false
          in: query
          description: >-
            Comma-separated exact capability set: context, commands, skills,
            agents, settings, channels, hooks, lsp, mcp.
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: Sort order for the current kind.
          schema:
            type: string
            enum:
              - installs
              - name
              - tenant
              - path
            default: installs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginsResponseDto'
              examples:
                Current catalog page:
                  summary: Real Nessy extension shape from the marketplace catalog
                  value:
                    total: 1
                    page: 1
                    pageSize: 20
                    plugins:
                      - id: >-
                          ai-office-devplatform-skills-devplatform-skills-b86ebb83
                        kind: nessy-extension
                        name: devplatform-skills
                        description: Nessy CLI extension with Commands, Skills, MCP
                        version: 1.4.0
                        path: https://gitlab.tcsbank.ru/ai-office/devplatform-skills
                        marketUrl: >-
                          https://skills-market.t-tech.team/plugin/ai-office-devplatform-skills-devplatform-skills-b86ebb83
                        metrics:
                          install_count: 0
                        install:
                          command: >-
                            nessy extensions install
                            @ai-office/nessy-extension-ai-office-devplatform-skills
                            --registry=https://artifactory.tcsbank.ru/artifactory/api/npm/npm-all
                            --auto-update
                        capabilities:
                          commands:
                            - commands
                          skills:
                            - skills
                          mcpServers:
                            - devplatform
          description: ''
      summary: Nessy extensions for IDE plugin marketplace
      tags:
        - catalog
  /v1/plugins/{id}:
    get:
      operationId: CatalogController_pluginById_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDetailsDto'
              examples:
                Current catalog details:
                  summary: Full extension details with manifest-derived metadata
                  value:
                    id: ai-office-devplatform-skills-devplatform-skills-b86ebb83
                    kind: nessy-extension
                    name: devplatform-skills
                    description: Nessy CLI extension with Commands, Skills, MCP
                    version: 1.4.0
                    path: https://gitlab.tcsbank.ru/ai-office/devplatform-skills
                    marketUrl: >-
                      https://skills-market.t-tech.team/plugin/ai-office-devplatform-skills-devplatform-skills-b86ebb83
                    metrics:
                      install_count: 0
                    install:
                      command: >-
                        nessy extensions install
                        @ai-office/nessy-extension-ai-office-devplatform-skills
                        --registry=https://artifactory.tcsbank.ru/artifactory/api/npm/npm-all
                        --auto-update
                    capabilities:
                      commands:
                        - commands
                      skills:
                        - skills
                      mcpServers:
                        - devplatform
                    summary: >-
                      Nessy extension v1.4.0 · Commands: commands · Skills:
                      skills · MCP: devplatform
                    manifestUrl: >-
                      https://gitlab.tcsbank.ru/ai-office/devplatform-skills/-/blob/master/nessy-extension.json
                    manifestPath: nessy-extension.json
                    manifest:
                      name: devplatform-skills
                      version: 1.4.0
                      commands:
                        - commands
                      skills:
                        - skills
                      mcpServers:
                        - devplatform
          description: ''
        '404':
          description: Plugin not found
      summary: Nessy extension details for one marketplace plugin
      tags:
        - catalog
  /v1/tihon/skills:
    get:
      operationId: TihonController_skills_v1
      parameters: []
      responses:
        '200':
          description: Raw JSON from acq-tihon upstream
        '502':
          description: Upstream unreachable or returned error
      summary: Passthrough proxy to acq-tihon public /skills
      tags:
        - tihon
    post:
      operationId: TihonController_createSkill_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example:
                name: FRY-3amigo
                description: Описание Skill
                prompt: Промпт Skill
                projectId: 2339
                public: false
      responses:
        '200':
          description: Raw JSON from acq-tihon upstream
        '201':
          description: Raw JSON from acq-tihon upstream
        '502':
          description: Upstream unreachable or returned error
      summary: Passthrough create request to acq-tihon /skills
      tags:
        - tihon
  /v1/tihon/test/skills:
    post:
      operationId: TihonController_createTestSkill_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example:
                name: skills-market-twork-token-test
                description: Тестовый Skill
                prompt: Промпт Skill
                projectId: 2339
                public: false
      responses:
        '200':
          description: Raw JSON from acq-tihon upstream
        '201':
          description: Raw JSON from acq-tihon upstream
        '401':
          description: Missing session or expired TWork access token
        '403':
          description: Skill Market admin access is required
        '502':
          description: Upstream unreachable or returned error
      summary: Admin-only create request to acq-tihon test /skills with TWork bearer
      tags:
        - tihon
  /v1/skill-packs:
    get:
      operationId: SkillPacksController_list_v1
      parameters:
        - name: type
          required: false
          in: query
          schema:
            enum:
              - profession
              - platform
              - business
              - personal
            type: string
        - name: q
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackListResponseDto'
      summary: List Skill Packs
      tags:
        - skill-packs
    post:
      operationId: SkillPacksController_create_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillPackRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
      summary: Create a personal Skill Pack
      tags:
        - skill-packs
  /v1/skill-packs/{id}/install-sources:
    get:
      operationId: SkillPacksController_installSources_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackInstallSourcesResponseDto'
        '404':
          description: Skill Pack not found
      summary: Ordered install sources for a Skill Pack
      tags:
        - skill-packs
  /v1/skill-packs/{id}:
    get:
      operationId: SkillPacksController_details_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
        '404':
          description: Skill Pack not found
      summary: Skill Pack details
      tags:
        - skill-packs
    patch:
      operationId: SkillPacksController_update_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillPackRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
        '403':
          description: Skill Pack edit access is required
      summary: Update Skill Pack metadata
      tags:
        - skill-packs
    delete:
      operationId: SkillPacksController_archive_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      summary: Archive a Skill Pack
      tags:
        - skill-packs
  /v1/skill-packs/{id}/items:
    post:
      operationId: SkillPacksController_addItem_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSkillPackItemRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
      summary: Add or update a Skill in a Skill Pack
      tags:
        - skill-packs
  /v1/skill-packs/{id}/items/{itemId}:
    delete:
      operationId: SkillPacksController_removeItem_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: itemId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
      summary: Remove a Skill from a Skill Pack
      tags:
        - skill-packs
  /v1/skill-packs/{id}/editors:
    post:
      operationId: SkillPacksController_addEditor_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillPackEditorRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
      summary: Add a Skill Pack editor
      tags:
        - skill-packs
  /v1/skill-packs/{id}/editors/{subject}:
    delete:
      operationId: SkillPacksController_removeEditor_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: subject
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPackDetailsDto'
      summary: Remove a Skill Pack editor
      tags:
        - skill-packs
  /v1/profession-recommendations/{professionKey}:
    get:
      operationId: ProfessionRecommendationsController_details_v1
      parameters:
        - name: professionKey
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionRecommendationDetailsDto'
        '404':
          description: Profession not found
      summary: Profession recommended Skills
      tags:
        - profession-recommendations
  /v1/profession-recommendations/{professionKey}/items:
    post:
      operationId: ProfessionRecommendationsController_addItem_v1
      parameters:
        - name: professionKey
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfessionRecommendationItemRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionRecommendationDetailsDto'
        '403':
          description: Profession recommendation edit access is required
      summary: Add a Skill to profession recommendations
      tags:
        - profession-recommendations
  /v1/profession-recommendations/{professionKey}/items/{itemId}:
    patch:
      operationId: ProfessionRecommendationsController_updateItem_v1
      parameters:
        - name: professionKey
          required: true
          in: path
          schema:
            type: string
        - name: itemId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/UpdateProfessionRecommendationItemRequestDto
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionRecommendationDetailsDto'
        '403':
          description: Profession recommendation edit access is required
      summary: Update a profession recommended Skill
      tags:
        - profession-recommendations
    delete:
      operationId: ProfessionRecommendationsController_removeItem_v1
      parameters:
        - name: professionKey
          required: true
          in: path
          schema:
            type: string
        - name: itemId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionRecommendationDetailsDto'
        '403':
          description: Profession recommendation edit access is required
      summary: Remove a Skill from profession recommendations
      tags:
        - profession-recommendations
  /v1/professions:
    get:
      operationId: ProfessionsController_list_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionDto'
      summary: List all professions known to Skills Market
      tags:
        - professions
  /v1/professions/{key}:
    get:
      operationId: ProfessionsController_details_v1
      parameters:
        - name: key
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionDetailsDto'
        '404':
          description: Profession not found
      summary: Profession details and permissions
      tags:
        - professions
  /v1/me:
    get:
      operationId: AuthController_me_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
        - Auth
  /auth/login:
    get:
      operationId: AuthController_login
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/callback:
    get:
      operationId: AuthController_callbackGet
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
    post:
      operationId: AuthController_callbackPost
      parameters: []
      responses:
        '201':
          description: ''
      tags:
        - Auth
  /auth/logout:
    get:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
info:
  title: nessy-marketplace-api
  description: Skills Market API
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: /api
    description: Production (ingress strips /api prefix before forwarding to this service)
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CanonicalSourceLockDto:
      type: object
      properties:
        cluster_id:
          type: string
        canonical_skill_url:
          type: string
        locked_by_type:
          type: string
          enum:
            - admin
            - profession
        locked_by:
          type: string
        locked_at:
          type: string
        updated_by:
          type: string
        invalid_reason:
          type: string
